name = "edgetunnel-v3"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# KV 命名空间绑定（部署前需先创建 KV namespace 并替换 id）
[[kv_namespaces]]
binding = "KV"
id = "your-kv-namespace-id"

# 环境变量（也可在 Cloudflare Dashboard 中设置）
# KEY 必填：随机字符串，长度 >= 16；未设置或使用旧默认文案时 Worker 返回 503
[vars]
# ADMIN = ""
# UUID = ""
# HOST = ""
# KEY = "replace-with-a-long-random-secret"
# PROXYIP = ""
# GO2SOCKS5 = ""
# URL = ""
# DEBUG = ""
# BEST_SUB = ""
# OFF_LOG = ""
# TCP_CONCURRENT_DIAL = ""
# PROXY_CONCURRENT_DIAL = ""
# PRELOAD_RACE_DIAL = ""
