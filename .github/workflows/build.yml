name: 构建与发布

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install & build
        run: |
          npm install
          npm run build

      - name: Commit dist/worker.js
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/worker.js dist/build-meta.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: rebuild dist/worker.js [skip ci]"
          fi
          git push origin HEAD:main

      - name: Create Release
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          RELEASE_NAME="edgetunnel-v3 ${TAG}"
          SIZE_KB=$(node -p "(require('./dist/build-meta.json').bytes/1024).toFixed(1)")
          LINES=$(node -p "require('./dist/build-meta.json').lines")
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes
          fi

          cat > notes.md << EOF
          ## ${RELEASE_NAME}

          | 文件 | 说明 |
          |------|------|
          | \`worker.js\` | 完整打包产物，复制到 Cloudflare Workers 粘贴部署 |

          - **版本**: \`${VERSION}\`
          - **大小**: \`${SIZE_KB} KB\` (${LINES} lines)

          ### 部署方式

          1. 打开 [Cloudflare Dashboard](https://dash.cloudflare.com) -> **Workers & Pages** -> 你的 Worker -> **Edit code**
          2. 下载下方 Assets 中的 \`worker.js\`，全选复制粘贴覆盖
          3. **Deploy**
          4. 绑定 KV（binding 名 \`KV\`），**必须**设置 \`ADMIN\` + \`KEY\`（≥16），推荐 \`UUID\`
          EOF

          git tag "$TAG"
          git push origin "$TAG"

          gh release create "$TAG" \
            --title "$RELEASE_NAME" \
            --notes-file notes.md \
            dist/worker.js
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: worker-js
          path: |
            dist/worker.js
            dist/build-meta.json
          retention-days: 30
