name: Release worker.js

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v3.0.1). Leave empty to use package.json version."
        required: false
        default: ""
      draft:
        description: "Create as draft release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.version }}" ]; then
            RAW="${{ inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RAW="${GITHUB_REF_NAME}"
          else
            RAW="v$(node -p "require('./package.json').version")"
          fi
          # normalize: ensure leading v
          case "$RAW" in
            v*) TAG="$RAW" ;;
            *)  TAG="v$RAW" ;;
          esac
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved tag=$TAG version=$VERSION"

      - name: Sync package.json version
        run: |
          node -e "
            const fs=require('fs');
            const p=JSON.parse(fs.readFileSync('package.json','utf8'));
            p.version='${{ steps.ver.outputs.version }}';
            fs.writeFileSync('package.json', JSON.stringify(p,null,2)+'\n');
          "

      - name: Build single-file worker.js
        env:
          RELEASE_VERSION: ${{ steps.ver.outputs.version }}
        run: npm run build

      - name: Prepare release assets
        run: |
          cp dist/worker.js "dist/edgetunnel-v3-${{ steps.ver.outputs.tag }}.js"
          cp dist/worker.js dist/worker.min-name.js
          # copy-friendly plain name
          ls -lah dist/

      - name: Generate release notes
        id: notes
        run: |
          META=$(cat dist/build-meta.json)
          BYTES=$(node -p "require('./dist/build-meta.json').bytes")
          LINES=$(node -p "require('./dist/build-meta.json').lines")
          SIZE_KB=$(node -p "(require('./dist/build-meta.json').bytes/1024).toFixed(1)")
          {
            echo "## edgetunnel-v3 ${{ steps.ver.outputs.tag }}"
            echo ""
            echo "### 📦 单文件 Worker（可直接粘贴）"
            echo ""
            echo "| 文件 | 说明 |"
            echo "|------|------|"
            echo "| \`worker.js\` | 完整打包产物，复制到 Cloudflare Workers 粘贴部署 |"
            echo "| \`edgetunnel-v3-${{ steps.ver.outputs.tag }}.js\` | 带版本号的同名文件 |"
            echo ""
            echo "- **版本**: \`${{ steps.ver.outputs.version }}\`"
            echo "- **大小**: \`${SIZE_KB} KB\` (${LINES} lines)"
            echo "- **构建时间**: $(node -p "require('./dist/build-meta.json').built")"
            echo ""
            echo "### 🚀 部署方式"
            echo ""
            echo "1. 打开 [Cloudflare Dashboard](https://dash.cloudflare.com) → **Workers & Pages** → 你的 Worker → **Edit code**"
            echo "2. 下载下方 Assets 中的 \`worker.js\`，全选复制粘贴覆盖"
            echo "3. **Deploy**"
            echo "4. 绑定 KV（binding 名 \`KV\`），配置环境变量 \`ADMIN\` / \`UUID\` 等"
            echo ""
            echo "### 🔗 静态管理页"
            echo ""
            echo "当前默认: https://nohello-ai.github.io/edt-pages-pro"
            echo ""
            echo "### 📝 模块源码"
            echo ""
            echo "源码目录: \`src/\` （模块化开发用）"
          } > release-notes.md
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: edgetunnel-v3 ${{ steps.ver.outputs.tag }}
          body_path: release-notes.md
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          generate_release_notes: true
          files: |
            dist/worker.js
            dist/edgetunnel-v3-${{ steps.ver.outputs.tag }}.js
            dist/build-meta.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit dist/ on main (optional snapshot)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # only update dist on default branch tip if we can
          git fetch origin main || true
          if git show-ref --verify --quiet refs/remotes/origin/main; then
            git checkout -B dist-snapshot origin/main
            mkdir -p dist
            # restore built artifacts from previous step workspace - still present
            git add dist/worker.js dist/build-meta.json package.json
            if git diff --cached --quiet; then
              echo "No dist changes to commit"
            else
              git commit -m "chore(release): bundle worker.js ${{ steps.ver.outputs.tag }} [skip ci]"
              git push origin dist-snapshot:main || echo "skip push dist (protected or conflict)"
            fi
          fi
