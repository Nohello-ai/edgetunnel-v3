name: Build dist on push

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "package.json"
      - "scripts/**"
      - ".github/workflows/build-dist.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-dist-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install & build
        run: |
          npm install
          npm run build

      - name: Commit dist/worker.js
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/worker.js dist/build-meta.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: rebuild dist/worker.js [skip ci]"
            git push
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: worker-js
          path: |
            dist/worker.js
            dist/build-meta.json
          retention-days: 14
